# Release, AssetTag style: every push to main builds and deploys what changed since the PREVIOUS PUSH. Nobody types a
# tag. The Android app ships (version bump, signed APK, update.json, tag mobile-v<version>, GitHub PRE-release) ONLY
# when the app or code it depends on changed: Mobile, Mobile.Data, Domain, Application, the mobile build scripts or
# shared build settings (.github/scripts/detect-changes.sh). Api/Web/Infrastructure/landing/workflow-only pushes run
# CI, migrate and deploy the site, and create no tag and no release. Releases are pre-releases: promote one by hand
# on GitHub (Edit > untick "Set as a pre-release"); the in-app updater offers pre-releases too.
#
# Version (.github/scripts/next-version.sh): highest mobile-v* tag (old v* tags if none) + patch, or NeedleBaseVersion
# from src/NeedleBase.Mobile/NeedleBase.Mobile.csproj when that is higher; never backwards. versionCode = run number +
# VERSION_CODE_OFFSET (always increases). Tags made with GITHUB_TOKEN never start workflows: no loops.
#
#   git push origin main                                   -> CI + deploy of the changed server parts; APK if the app changed
#   Actions > Release > Run workflow (from main)           -> rebuild + redeploy the site; tick build_android for an APK
#                                                             (bump: patch | minor | major)
#   Actions > Release > Run workflow (from an older commit/tag) -> roll the site back to that code (no APK unless ticked)
# Secrets and variables: docs/ci-cd.md.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", ".cursor/**"]
  workflow_dispatch:
    inputs:
      build_android:
        description: Also build and release a new Android APK (mobile-v tag, pre-release)
        type: boolean
        default: false
      bump:
        description: Version bump for that APK (ignored when NeedleBaseVersion in the csproj is already higher)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  # Never two releases at once and never cancel one half-way (it may be deploying).
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  meta:
    name: Changes + version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # last successful Release run (diff base)
    outputs:
      core: ${{ steps.changes.outputs.core }}
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      mobile: ${{ steps.changes.outputs.mobile }}
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # history + all tags (diff base, next version)
      # Push: diff against the previous push (github.event.before), or further back to the last SUCCESSFUL Release
      # run on main when that is older, so a failed run or a queued push that GitHub skipped (concurrency keeps only
      # the newest pending run) is retried. A new branch, a force push (base not in the history) or a zero sha
      # builds everything. Manual run: the whole site; the app only when build_android is ticked.
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BUILD_ANDROID: ${{ inputs.build_android }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            mobile=false; [[ "$BUILD_ANDROID" == "true" ]] && mobile=true
            out=$(printf 'core=true\napi=true\nweb=true\nmobile=%s' "$mobile")
            echo "Manual run: site rebuilt and redeployed; Android: $mobile" >> "$GITHUB_STEP_SUMMARY"
          else
            usable() { [[ -n "$1" && ! "$1" =~ ^0+$ ]] && git merge-base --is-ancestor "$1" HEAD 2>/dev/null; }
            base="$BEFORE"
            good=$(gh run list -R "$REPO" --workflow release.yml --branch main --event push --status success \
              --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)
            if usable "$good" && { ! usable "$base" || git merge-base --is-ancestor "$good" "$base"; }; then
              [[ "$good" != "$base" ]] && echo "Including changes since the last successful release run ${good:0:7}." >> "$GITHUB_STEP_SUMMARY"
              base="$good"
            fi
            if ! usable "$base"; then
              echo "No usable previous push ('${base:-none}'): building everything." >> "$GITHUB_STEP_SUMMARY"
              base=""
            fi
            out=$(GITHUB_OUTPUT='' .github/scripts/detect-changes.sh "$base" HEAD | grep -E '^(core|api|web|mobile)=')
          fi
          echo "$out" | tee -a "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"
      - id: v
        if: steps.changes.outputs.mobile == 'true'
        env:
          OFFSET: ${{ vars.VERSION_CODE_OFFSET }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          # Rerun-safe: this commit already got a mobile-v tag (earlier attempt of this run) -> reuse that version.
          existing=$(git tag --points-at HEAD -l 'mobile-v*' | sed -n 's/^mobile-v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' | sort -V | tail -n 1)
          if [[ -n "$existing" ]]; then
            version="$existing"
          elif ! version=$(.github/scripts/next-version.sh 2>"$RUNNER_TEMP/version.err"); then
            echo "::error::$(cat "$RUNNER_TEMP/version.err")"; exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$version')."; exit 1
          fi
          offset="${OFFSET:-0}"
          [[ "$offset" =~ ^[0-9]{1,9}$ ]] || { echo "::error::VERSION_CODE_OFFSET must be a whole number."; exit 1; }
          code="$((GITHUB_RUN_NUMBER + 10#$offset))"
          if [[ ! "$code" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::versionCode must be 1..999999999 (got '$code')."; exit 1
          fi
          { echo "version=$version"; echo "code=$code"; } >> "$GITHUB_OUTPUT"
          echo "### NeedleBase Android $version (versionCode $code), tag mobile-v$version" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: meta
    uses: ./.github/workflows/ci.yml
    with:
      core: ${{ needs.meta.outputs.core }}
      api: ${{ needs.meta.outputs.api }}
      web: ${{ needs.meta.outputs.web }}
      mobile: ${{ needs.meta.outputs.mobile }}

  android:
    name: Android (signed APK + optional AAB)
    needs: [meta, ci]
    if: needs.ci.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: microsoft
          java-version: "17"
      - uses: ./.github/actions/setup-dotnet-maui
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."; exit 1; fi
          umask 077
          ks="$RUNNER_TEMP/needlebase-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          echo "NEEDLEBASE_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
      - name: Build signed APK (sideload, in-app updates) and AAB (Play, no updater)
        env:
          NEEDLEBASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEEDLEBASE_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEEDLEBASE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # The app calls relative "api/..." paths, so its base URL is the SITE ROOT (Api lives at /api).
          SITE_URL: ${{ vars.SITE_URL }}
          VERSION: ${{ needs.meta.outputs.version }}
          CODE: ${{ needs.meta.outputs.code }}
          # The Play bundle is a second build (it must not contain the updater or REQUEST_INSTALL_PACKAGES).
          BUILD_AAB: ${{ vars.PLAY_UPLOAD_ENABLED == 'true' }}
        # Passwords reach MSBuild only through the environment (AndroidSigning*Pass = env:...), never argv.
        run: |
          set -euo pipefail
          # Site ROOT only (https://host/); a path such as /api/ would make the app call /api/api/...
          if [[ ! "$SITE_URL" =~ ^https://[^/[:space:]]+/?$ ]]; then
            echo "::error::SITE_URL must be the site root, e.g. https://needlebase.example/ (got '$SITE_URL')."; exit 1
          fi
          # In-app updates (AssetTag style): the APK asks its own Api, ${SITE_URL}api/mobile/update, which serves the
          # update.json attached to the newest GitHub Release (android-release.sh sets that address by default).
          scripts/android-release.sh --format apk "${SITE_URL%/}/" "$VERSION" "$CODE"
          if [[ "$BUILD_AAB" == "true" ]]; then
            scripts/android-release.sh --format aab "${SITE_URL%/}/" "$VERSION" "$CODE"
          fi
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/needlebase-upload.jks"
      - name: Rename for release
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CODE: ${{ needs.meta.outputs.code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/android/"$VERSION-$CODE"-apk/*-Signed.apk "dist/needlebase-$VERSION-$CODE.apk"
          shopt -s nullglob
          for f in artifacts/android/"$VERSION-$CODE"-aab/*-Signed.aab; do cp "$f" "dist/needlebase-$VERSION-$CODE.aab"; done
      # update.json for the in-app updater, attached to the GitHub Release next to the APK (the Api serves it to the
      # app): GitHub download address, hash, size, signing certificate (read from the APK itself with apksigner, which
      # also verifies the signature), minimum supported build and release notes (commit message).
      - name: Update manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CODE: ${{ needs.meta.outputs.code }}
          MIN_CODE: ${{ vars.ANDROID_MIN_SUPPORTED_VERSION_CODE }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="dist/needlebase-$VERSION-$CODE.apk"
          # Any apksigner wording (build-tools 37 prints "V3.0 Signer: certificate SHA-256 digest"), keytool fallback;
          # fails if the APK is unsigned or doesn't verify.
          bash .github/scripts/update-manifest.sh certs --apk "$apk" > "$RUNNER_TEMP/certs.txt" ||
            { echo "::error::$apk is unsigned, doesn't verify, or no signing certificate could be read (log above)."; exit 1; }
          mapfile -t certs < "$RUNNER_TEMP/certs.txt"
          [[ ${#certs[@]} -gt 0 ]] || { echo "::error::No signing certificate found in $apk."; exit 1; }
          # Release notes = the pushed commit's message (the tag is created later, by the release job).
          git log -1 --format=%B > "$RUNNER_TEMP/notes.txt" || true
          [[ -s "$RUNNER_TEMP/notes.txt" ]] && [[ -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.txt")" ]] || echo "NeedleBase $VERSION" > "$RUNNER_TEMP/notes.txt"
          cert_args=(); for c in "${certs[@]}"; do cert_args+=(--cert "$c"); done
          # The release (tag mobile-v$VERSION) is created by the github-release job with this exact file name.
          apk_url="https://github.com/$REPOSITORY/releases/download/mobile-v$VERSION/needlebase-$VERSION-$CODE.apk"
          bash .github/scripts/update-manifest.sh manifest --apk "$apk" --apk-url "$apk_url" --version "$VERSION" --code "$CODE" \
            --min "${MIN_CODE:-0}" --notes "$RUNNER_TEMP/notes.txt" "${cert_args[@]}" --out dist/update.json
          cat dist/update.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  server:
    name: Server packages + migration SQL
    needs: [meta, ci]
    if: needs.ci.outputs.api == 'true' || needs.ci.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet-maui
        with:
          maui: "false"
      - name: Publish the site (Web with the Api inside)
        # ONE package for the one MonsterASP site, like Platform: the Web process hosts the Api under /api
        # (Api:InProcess), so no IIS sub-application is needed. Framework-dependent, out-of-process (as AssetTag on
        # MonsterASP). No secrets in the package: settings are environment variables on the site (docs/production-config.md).
        env:
          # Set only when this push also ships an APK; a server-only deploy keeps the project's default version.
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          out=artifacts/publish/site
          ver=(); [[ -n "$VERSION" ]] && ver=(-p:Version="$VERSION")
          dotnet publish src/NeedleBase.Web/NeedleBase.Web.csproj -c Release -o "$out" \
            -p:UseAppHost=false -p:AspNetCoreHostingModel=OutOfProcess "${ver[@]}"
          rm -f "$out/appsettings.Development.json"
          rm -rf "$out/App_Data"
      # Non-secret URLs from SITE_URL into the package's web.config (aspNetCore environmentVariables, inside the
      # non-inheriting <location>): Api__BaseUrl and FrontendBaseUrl = the site root. Secrets never go here.
      - name: Write site URLs into the package
        shell: pwsh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          Import-Module ./.github/scripts/iis-deploy/WebDeploy.psm1
          # Throws unless SITE_URL is an https site root such as https://needlebase.runasp.net/.
          Set-PackageEnvironment -Path artifacts/publish/site -Variables (Get-SitePackageEnvironment -SiteUrl $env:SITE_URL)
      - name: Check the site package
        # Fails before the deploy starts: web.config must not leak into child applications, no App_Data or
        # development settings, and the site URLs must be in place.
        shell: pwsh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          Import-Module ./.github/scripts/iis-deploy/WebDeploy.psm1
          $bad = $false
          foreach ($p in Test-DeployPackage -Path artifacts/publish/site -RequiredEnvironment (Get-SitePackageEnvironment -SiteUrl $env:SITE_URL)) {
            Write-Host "::error::artifacts/publish/site: $p"; $bad = $true
          }
          if ($bad) { exit 1 }
      - name: Idempotent migration script
        if: needs.ci.outputs.api == 'true'
        run: scripts/db-migrate.sh script
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-site
          path: artifacts/publish/site
          if-no-files-found: error
          retention-days: 30
      - if: needs.ci.outputs.api == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migrations
          path: artifacts/migrations/needlebase-migrate.sql
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: GitHub Release
    needs: [meta, ci, android, server, deploy]
    # Only when an APK was built: tag mobile-v<version> + a PRE-release (promote it by hand on GitHub). Waits for the
    # deploy when the same push also changed the server, and is skipped if anything failed. Server-only pushes
    # create no tag and no release. Rerun-safe: a rerun reuses the version already tagged on this commit and the
    # release action updates the existing release instead of making a second one.
    if: >-
      always() && needs.android.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: dist
      - if: needs.ci.outputs.api == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: migrations
          path: dist
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CODE: ${{ needs.meta.outputs.code }}
          API: ${{ needs.ci.outputs.api }}
          WEB: ${{ needs.ci.outputs.web }}
          MOBILE: ${{ needs.ci.outputs.mobile }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ -f dist/needlebase-migrate.sql ]]; then mv dist/needlebase-migrate.sql "dist/needlebase-$VERSION-migrate.sql"; fi
          shopt -s nullglob
          files=(dist/*)
          if (( ${#files[@]} > 0 )); then (cd dist && sha256sum -- * > SHA256SUMS); fi
          {
            echo "NeedleBase Android $VERSION (pre-release; promote it on GitHub when tested). Same push also deployed: Api=$API Web=$WEB."
            echo
            if [[ "$MOBILE" == true ]]; then
              echo "**Sideload (Android, versionCode $CODE):** download \`needlebase-$VERSION-$CODE.apk\` and run \`adb install -r needlebase-$VERSION-$CODE.apk\`, or copy it to the phone and open it (allow \"Install unknown apps\" for the app you open it with). It installs over the previous version and keeps the phone's data. Check the file with \`sha256sum -c SHA256SUMS --ignore-missing\`."
              echo
              if [[ -f "dist/needlebase-$VERSION-$CODE.aab" ]]; then
                echo "**Google Play:** \`needlebase-$VERSION-$CODE.aab\` (same upload key, no in-app updater)."
                echo
              fi
              echo "**Already installed?** The app offers this version itself (More › Check for updates); it reads \`update.json\` from this release through the Api."
              echo
            fi
            if [[ "$API" == true ]]; then
              echo "**Database:** \`needlebase-$VERSION-migrate.sql\` is idempotent (safe on any older database)."
            fi
          } > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: mobile-v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NeedleBase Android ${{ needs.meta.outputs.version }}
          body_path: notes.md
          prerelease: true
          make_latest: false
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.sql
            dist/update.json
            dist/SHA256SUMS

  deploy:
    name: Deploy to MonsterASP
    needs: [meta, ci, server]
    # Like AssetTag: every release deploys what it built. No approval step (add Required reviewers to the
    # "production" environment if you ever want one); the environment only holds the deploy and database secrets.
    if: needs.server.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 45  # worst case: deploy + rollback with health checks of up to 9 min each; never cut a rollback short
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      # One MonsterASP site, one IIS application: the Web at the root hosts the Api under /api (docs/deployment.md).
      MONSTER_SERVER: ${{ secrets.MONSTER_SERVER }}
      MONSTER_SITE: ${{ secrets.MONSTER_SITE }}
      MONSTER_USER: ${{ secrets.MONSTER_USER }}
      MONSTER_PASSWORD: ${{ secrets.MONSTER_PASSWORD }}
      MONSTER_ALLOW_UNTRUSTED: ${{ vars.MONSTER_ALLOW_UNTRUSTED }}
      SITE_URL: ${{ vars.SITE_URL }}
      # First deploy only: the free plan issues the certificate after the site is uploaded (docs/deployment.md).
      # true = health checks become plain-http smoke checks that never fail or roll back. The apps themselves stay
      # https-only (Secure cookies, https Api:BaseUrl, HSTS): sign-in does not work until HTTPS is on. Remove it then.
      SITE_HTTPS_PENDING: ${{ vars.SITE_HTTPS_PENDING }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-site
          path: pkg/site
      - if: needs.ci.outputs.api == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: migrations
          path: pkg/migrations
      - name: Check settings
        shell: pwsh
        run: |
          Import-Module ./.github/scripts/iis-deploy/WebDeploy.psm1
          foreach ($n in 'MONSTER_SERVER', 'MONSTER_SITE', 'MONSTER_USER', 'MONSTER_PASSWORD') {
            Assert-MsDeployValue -Name $n -Value ([Environment]::GetEnvironmentVariable($n))
          }
          $null = Get-MsDeployEndpoint -Server $env:MONSTER_SERVER -Site $env:MONSTER_SITE
          $null = Get-ApiHealthUrl -SiteUrl $env:SITE_URL
          if ($env:SITE_HTTPS_PENDING -eq 'true') {
            Write-Host "::warning::SITE_HTTPS_PENDING=true: post-deploy health checks are http smoke checks only and NOTHING is rolled back. Ask MonsterASP support to enable HTTPS, then delete the variable and re-run."
          }

      # 1. Database first: the new Api expects the new schema. Idempotent, one transaction, stops on first error.
      #    Forward-only: a later rollback restores files, not the schema (restore the pre-release DB backup if needed).
      - name: Apply migrations
        if: needs.ci.outputs.api == 'true'
        shell: pwsh
        env:
          DB_URL: ${{ secrets.PROD_DB_MIGRATION_CONNECTION_STRING }}
        run: |
          $sql = 'pkg/migrations/needlebase-migrate.sql'
          if ([string]::IsNullOrWhiteSpace($env:DB_URL)) { throw 'PROD_DB_MIGRATION_CONNECTION_STRING is not set (docs/ci-cd.md).' }
          Import-Module ./.github/scripts/iis-deploy/WebDeploy.psm1
          # Npgsql string or postgres:// URI -> PG* variables: the connection never appears on a command line.
          $pg = ConvertTo-PgEnvironment -Connection $env:DB_URL
          foreach ($k in $pg.Keys) { if ($pg[$k]) { Set-Item -Path "env:$k" -Value $pg[$k] } }
          $env:DB_URL = $null
          $env:PGCONNECT_TIMEOUT = '20'
          $candidates = @()
          if ($env:PGBIN) { $candidates += Join-Path $env:PGBIN 'psql.exe' }
          $onPath = Get-Command psql -ErrorAction SilentlyContinue
          if ($onPath) { $candidates += $onPath.Source }
          $candidates += @(Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\psql.exe' -ErrorAction SilentlyContinue |
            Sort-Object { [int]($_.Directory.Parent.Name -replace '\D.*$', '') } -Descending | ForEach-Object FullName)
          $psql = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $psql) { throw 'psql not found on the runner (PGBIN, PATH, C:\Program Files\PostgreSQL).' }
          & $psql --no-psqlrc -v ON_ERROR_STOP=1 --quiet --file=$sql
          if ($LASTEXITCODE -eq 2) { throw "Could not connect to the database (psql exit 2, e.g. timeout). Check that remote database access is enabled in the MonsterASP panel and that the connection string uses the PUBLIC host name (not a 10.x/private address); nothing was deployed." }
          if ($LASTEXITCODE -ne 0) { throw "Migration failed (exit $LASTEXITCODE); the transaction was rolled back, nothing was deployed." }

      # The Api's server settings go into the site's web.config here (never into the uploaded artifact): one database,
      # so the running app uses PROD_DB_MIGRATION_CONNECTION_STRING too. JWT key: JWT_SECURITY_KEY, or derived from the
      # database secret (stable across deploys). Platform licensing only when PLATFORM_BASE_URL + PLATFORM_INTEGRATION_KEY
      # are set. Values are masked before anything can print them. Every site deploy needs them (the Api is inside).
      - name: Write server settings into the site package
        shell: pwsh
        env:
          DB_URL: ${{ secrets.PROD_DB_MIGRATION_CONNECTION_STRING }}
          JWT_SECURITY_KEY: ${{ secrets.JWT_SECURITY_KEY }}
          PLATFORM_INTEGRATION_KEY: ${{ secrets.PLATFORM_INTEGRATION_KEY }}
          PLATFORM_BASE_URL: ${{ vars.PLATFORM_BASE_URL }}
          PLATFORM_TOKEN_ISSUER: ${{ vars.PLATFORM_TOKEN_ISSUER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DB_URL)) { throw 'PROD_DB_MIGRATION_CONNECTION_STRING is not set (docs/ci-cd.md).' }
          Import-Module ./.github/scripts/iis-deploy/WebDeploy.psm1
          $vars = Get-ApiServerEnvironment -DbConnection $env:DB_URL -JwtKey $env:JWT_SECURITY_KEY `
            -PlatformBaseUrl $env:PLATFORM_BASE_URL -PlatformKey $env:PLATFORM_INTEGRATION_KEY -PlatformIssuer $env:PLATFORM_TOKEN_ISSUER
          foreach ($n in 'ConnectionStrings__DefaultConnection', 'JwtSettings__SecurityKey', 'Platform__IntegrationKey') {
            if ($vars.Contains($n)) { Write-Host "::add-mask::$($vars[$n])" }
          }
          Set-PackageEnvironment -Path pkg/site -Variables $vars
          if ($vars['Platform__RequireLicenseKey'] -eq 'false') {
            Write-Host "::warning::PLATFORM_BASE_URL / PLATFORM_INTEGRATION_KEY not set: license keys are off (shops register without one)."
          }
          Write-Host "Server settings written: $($vars.Keys -join ', ')"

      # 2. The site (Web + Api) at the root. The current site is copied to the RUNNER first (never uploaded as an
      #    artifact: its web.config may hold panel settings) so a failed deploy or health check is rolled back
      #    automatically. A backup failure is a warning only (first deploy). msdeploy syncs the root, so the folder
      #    "api" left by the old two-application layout is removed (except api/App_Data: key rings are never deleted).
      - name: Back up current site
        id: site_backup
        continue-on-error: true
        shell: pwsh
        run: ./.github/scripts/iis-deploy/Deploy-Site.ps1 -Mode Backup -Path "$env:RUNNER_TEMP/backup/site"
      - name: Deploy site to /
        id: site_deploy
        shell: pwsh
        run: ./.github/scripts/iis-deploy/Deploy-Site.ps1 -Path pkg/site
      - name: Api /api/health/ready and the Web
        id: site_health
        continue-on-error: ${{ vars.SITE_HTTPS_PENDING == 'true' }}
        shell: pwsh
        run: |
          Import-Module ./.github/scripts/iis-deploy/WebDeploy.psm1
          $urls = @((Get-ApiHealthUrl -SiteUrl $env:SITE_URL), $env:SITE_URL)
          foreach ($url in $urls) {
            if ($env:SITE_HTTPS_PENDING -eq 'true') {
              ./.github/scripts/iis-deploy/Wait-Healthy.ps1 -Url ($url -replace '^https://', 'http://') -Attempts 6 -AllowHttp
            } else {
              ./.github/scripts/iis-deploy/Wait-Healthy.ps1 -Url $url
            }
          }
      - name: Roll back site
        if: failure() && steps.site_backup.outcome == 'success' && (steps.site_deploy.outcome == 'failure' || steps.site_health.outcome == 'failure')
        shell: pwsh
        run: |
          ./.github/scripts/iis-deploy/Deploy-Site.ps1 -Mode Restore -Path "$env:RUNNER_TEMP/backup/site"
          Write-Host "::error::Site rolled back to the previous files. Migrations already applied stay applied."
          Import-Module ./.github/scripts/iis-deploy/WebDeploy.psm1
          ./.github/scripts/iis-deploy/Wait-Healthy.ps1 -Url (Get-ApiHealthUrl -SiteUrl $env:SITE_URL) -Attempts 6
      - name: Remove server backups
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/backup" -Recurse -Force -ErrorAction SilentlyContinue

  play:
    name: Google Play (internal track)
    needs: [meta, android]
    # Skipped when Android did not change (android job skipped). Off until PLAY_UPLOAD_ENABLED=true (repository variable).
    if: vars.PLAY_UPLOAD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: play-store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: dist
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.helmutcode.needlebase
          releaseFiles: dist/needlebase-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.code }}.aab
          releaseName: ${{ needs.meta.outputs.version }} (${{ needs.meta.outputs.code }})
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
